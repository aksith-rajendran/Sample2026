<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager | Add Task</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .form-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 2.5rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .error-msg {
      color: var(--danger);
      font-size: 0.8rem;
      margin-top: 0.5rem;
      display: none;
    }
    #successAlert {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--success);
      color: var(--success);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: none;
    }
  </style>
</head>
<body>
  <header class="glass-panel">
    <h2>TaskManager</h2>
    <nav>
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="../dashboard/index.html">Dashboard</a></li>
        <li><a href="../tasks/index.html">Tasks</a></li>
        <li><a href="index.html" class="active">Add Task</a></li>
        <li><a href="../profile/index.html">Profile</a></li>
      </ul>
    </nav>
  </header>

  <main class="animate-fade-in">
    <div class="form-container glass-panel">
      <h2 style="margin-bottom: 1.5rem; color: var(--secondary-color);">Create New Task</h2>
      <div id="successAlert">Task added successfully!</div>

      <form id="addTaskForm">
        <div class="form-group">
          <label for="taskTitle">Task Title *</label>
          <input type="text" id="taskTitle" placeholder="e.g., Read Chapter 5" required>
          <div class="error-msg" id="titleError">Title is required.</div>
        </div>

        <div class="form-group">
          <label for="taskSubject">Subject *</label>
          <input type="text" id="taskSubject" placeholder="e.g., Biology" required>
        </div>

        <div class="form-group">
          <label for="taskDate">Due Date *</label>
          <input type="date" id="taskDate" required>
        </div>

        <div class="form-group">
          <label for="taskPriority">Priority</label>
          <select id="taskPriority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Save Task</button>
      </form>
    </div>
  </main>
  <script src="add-task.js"></script>
</body>
</html>
